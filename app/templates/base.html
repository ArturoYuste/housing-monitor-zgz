<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Housing Monitor{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <strong>Housing Monitor</strong>
        <span>Revisa, guarda y gestiona casas</span>
      </div>
      <nav class="nav">
        <a href="/" class="{% if request.url.path == '/' %}active{% endif %}">Dashboard</a>
        <a href="/settings" class="{% if request.url.path == '/settings' %}active{% endif %}">Criterios</a>
      </nav>
    </header>
    {% block content %}{% endblock %}
  </div>

  <div id="lightbox" class="lightbox" hidden aria-hidden="true">
    <button type="button" class="lightbox__backdrop" data-lightbox-close aria-label="Cerrar"></button>
    <div class="lightbox__dialog" role="dialog" aria-modal="true" aria-label="Foto ampliada">
      <button type="button" class="lightbox__close" data-lightbox-close aria-label="Cerrar">×</button>
      <button type="button" class="lightbox__nav lightbox__nav--prev" data-lightbox-prev aria-label="Anterior">‹</button>
      <img id="lightbox-image" class="lightbox__image" alt="Foto ampliada">
      <button type="button" class="lightbox__nav lightbox__nav--next" data-lightbox-next aria-label="Siguiente">›</button>
      <p id="lightbox-caption" class="lightbox__caption"></p>
    </div>
  </div>

  <script>
    (function () {
      const root = document.getElementById("lightbox");
      const img = document.getElementById("lightbox-image");
      const caption = document.getElementById("lightbox-caption");
      let urls = [];
      let index = 0;

      function render() {
        if (!urls.length) return;
        img.src = urls[index];
        caption.textContent = (index + 1) + " / " + urls.length;
      }

      function openLightbox(list, start) {
        urls = list;
        index = start;
        root.hidden = false;
        root.setAttribute("aria-hidden", "false");
        document.body.classList.add("lightbox-open");
        render();
      }

      function closeLightbox() {
        root.hidden = true;
        root.setAttribute("aria-hidden", "true");
        document.body.classList.remove("lightbox-open");
        img.removeAttribute("src");
        urls = [];
      }

      function step(delta) {
        if (!urls.length) return;
        index = (index + delta + urls.length) % urls.length;
        render();
      }

      document.addEventListener("click", function (event) {
        const trigger = event.target.closest("[data-lightbox-src]");
        if (trigger) {
          event.preventDefault();
          const strip = trigger.closest(".photo-strip");
          const nodes = strip
            ? Array.from(strip.querySelectorAll("[data-lightbox-src]"))
            : [trigger];
          const list = nodes.map(function (node) { return node.getAttribute("data-lightbox-src"); });
          const start = Math.max(0, nodes.indexOf(trigger));
          openLightbox(list, start);
          return;
        }
        if (event.target.closest("[data-lightbox-close]")) {
          closeLightbox();
        } else if (event.target.closest("[data-lightbox-prev]")) {
          step(-1);
        } else if (event.target.closest("[data-lightbox-next]")) {
          step(1);
        }
      });

      document.addEventListener("keydown", function (event) {
        if (root.hidden) return;
        if (event.key === "Escape") closeLightbox();
        if (event.key === "ArrowLeft") step(-1);
        if (event.key === "ArrowRight") step(1);
      });
    })();
  </script>
</body>
</html>
